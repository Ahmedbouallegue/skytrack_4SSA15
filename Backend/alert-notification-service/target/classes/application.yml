server:
  port: 8083

spring:
  application:
    name: alert-notification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/skytrack_alerts}
      auto-index-creation: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

# Eureka registration (service registry on port 8761)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Services this one calls (OpenFeign).
# By default they are found in Eureka by name (= spring.application.name of the other service).
# Setting LOCATION_SERVICE_URL / USER_SERVICE_URL forces a fixed address and bypasses Eureka.
clients:
  location-service:
    name: ${LOCATION_SERVICE_NAME:location-service}
    url: ${LOCATION_SERVICE_URL:}
  user-service:
    name: ${USER_SERVICE_NAME:user-service}
    url: ${USER_SERVICE_URL:}

skytrack:
  # Allowed origin for the Angular frontend (no API gateway)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # When true, cityId / userId are checked against Location / User services.
  # Set REMOTE_CHECKS_ENABLED=false to work on this service while the others are not running.
  remote-checks:
    enabled: ${REMOTE_CHECKS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
