services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-skytrack-admin-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-skytrack}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-iot_sensor}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN before starting}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  iot-sensor-service:
    build: .
    ports:
      - "8084:8084"
    depends_on:
      - influxdb
    environment:
      SERVER_PORT: 8084
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-skytrack}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-iot_sensor}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN before starting}

volumes:
  influxdb-data:
  influxdb-config:
