spring.application.name=forecast-service
server.port=8082

# serverSelectionTimeoutMS=2000 : si MongoDB est arrêté, /actuator/health répond DOWN en 2 s au lieu de 30 s
spring.data.mongodb.uri=mongodb://localhost:27017/forecast_db?serverSelectionTimeoutMS=2000

# --- Actuator ---
# Endpoints exposés (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Détail des composants dans /health (mongo, forecastStore, diskSpace, ping...)
management.endpoint.health.show-details=always
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true

# Contenu de /actuator/info
info.app.name=forecast-service
info.app.version=1.0.0
# (accents en \u00XX : Spring Boot lit ce fichier en ISO-8859-1)
info.app.description=Microservice de gestion des pr\u00e9visions m\u00e9t\u00e9o par ville
info.app.database=MongoDB (forecast_db)
info.app.team=SkyTrack - Med Dhia Allagui, Yasmine Fehri, Ahmed Bouallegue, Abdallah Grissa, Yassine Wesslati, Salim Khaldi

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Transmettre à Eureka le statut de /actuator/health (DOWN si MongoDB tombe)
eureka.client.healthcheck.enabled=true
